root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "templ generate && go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "node_modules", "server/remotion", "bin", "output", "audio"]
  exclude_regex = ["_templ\\.go$"]
  include_ext = ["go", "templ", "css"]
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
